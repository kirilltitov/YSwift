name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (Linux, Swift 6.3)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4

      - name: Lint (swift-format)
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Build and run the conformance suite
        run: swift test
