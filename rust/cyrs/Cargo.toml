[package]
name = "cyrs"
version = "0.1.0"
edition = "2021"
description = "C ABI over the Rust yrs CRDT, backing YSwift's Phase-1 engine (YrsEngine)."
publish = false

[lib]
# staticlib: the linkable archive Swift consumes; lib: so Rust tests can use it.
crate-type = ["staticlib", "lib"]

[dependencies]
# `sync` makes Doc/Subscription Send+Sync (Arc/atomics) — required because the
# Swift side drives one doc from a serialized-but-multi-threaded backend.
yrs = { version = "0.27", features = ["sync"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
